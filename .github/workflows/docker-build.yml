name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: grandcamel/claude-devcontainer

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-enhanced:
    name: Build Enhanced Image
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=enhanced,enable={{is_default_branch}}
            type=semver,pattern={{version}}-enhanced
            type=sha,prefix=enhanced-

      - name: Build and push enhanced image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.enhanced
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test Images
    runs-on: ubuntu-latest
    needs: [build-base, build-enhanced]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build --no-cache -t test-base -f Dockerfile .

      - name: Test base toolchains
        run: |
          echo "=== Python ===" && docker run --rm test-base python3 --version
          echo "=== Node ===" && docker run --rm test-base node --version
          echo "=== npm ===" && docker run --rm test-base npm --version
          echo "=== Go ===" && docker run --rm test-base go version
          echo "=== Rust ===" && docker run --rm test-base rustc --version
          echo "=== Cargo ===" && docker run --rm test-base cargo --version

      - name: Test base CLI tools
        run: |
          echo "=== Git ===" && docker run --rm test-base git --version
          echo "=== GitHub CLI ===" && docker run --rm test-base gh --version
          echo "=== AWS CLI ===" && docker run --rm test-base aws --version
          echo "=== Docker CLI ===" && docker run --rm test-base docker --version
          echo "=== ripgrep ===" && docker run --rm test-base rg --version
          echo "=== jq ===" && docker run --rm test-base jq --version

      - name: Test base Python packages
        run: |
          docker run --rm test-base python3 -c "import pytest; print(f'pytest {pytest.__version__}')"
          docker run --rm test-base python3 -c "import httpx; print(f'httpx {httpx.__version__}')"
          docker run --rm test-base python3 -c "import pandas; print(f'pandas {pandas.__version__}')"

      - name: Build enhanced image
        run: docker build --no-cache -t test-enhanced -f Dockerfile.enhanced .

      - name: Test enhanced CLI tools
        run: |
          echo "=== Starship ===" && docker run --rm test-enhanced starship --version
          echo "=== eza ===" && docker run --rm test-enhanced eza --version
          echo "=== bat ===" && docker run --rm test-enhanced bat --version
          echo "=== delta ===" && docker run --rm test-enhanced delta --version
          echo "=== zoxide ===" && docker run --rm test-enhanced zoxide --version
          echo "=== lazygit ===" && docker run --rm test-enhanced lazygit --version
          echo "=== btop ===" && docker run --rm test-enhanced btop --version
          echo "=== tmux ===" && docker run --rm test-enhanced tmux -V
          echo "=== neovim ===" && docker run --rm test-enhanced nvim --version | head -1

      - name: Test enhanced shell configuration
        run: |
          # Verify starship and zoxide are in bashrc
          docker run --rm test-enhanced grep -q "starship init" /home/devuser/.bashrc
          docker run --rm test-enhanced grep -q "zoxide init" /home/devuser/.bashrc
          # Verify delta is configured in git
          docker run --rm test-enhanced git config --global --get core.pager | grep -q delta
